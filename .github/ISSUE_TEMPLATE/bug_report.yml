name: Bug Report
description: Report a bug or issue with Double Shift Search
title: '[Bug] '
labels: ['bug']
body:
    - type: markdown
      attributes:
          value: |
              Thanks for taking the time to fill out this bug report! Please provide as much detail as possible.
    - type: input
      id: version
      attributes:
          label: DSS Version
          description: What version of Double Shift Search are you running?
          placeholder: e.g., v1.0.0
      validations:
          required: true
    - type: textarea
      id: description
      attributes:
          label: Description of the Bug
          description: A clear and concise description of what the bug is.
      validations:
          required: true
    - type: textarea
      id: reproduction
      attributes:
          label: Steps to Reproduce
          description: How can we reproduce this bug? Include any specific repository states or commands used.
          value: |
              1.
              2.
              3.
      validations:
          required: true
    - type: textarea
      id: expected
      attributes:
          label: Expected Behavior
          description: What did you expect to happen?
      validations:
          required: true
    - type: input
      id: os
      attributes:
          label: Operating System
          description: What OS are you using? (Windows, macOS, Linux)
      validations:
          required: true
